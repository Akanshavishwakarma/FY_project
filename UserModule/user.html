<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>

    <link rel="stylesheet" href="./layout/userNavigation.css" />
  </head>
  <body style="background-color: #f9f5ef; color: #800020; text-align: center">
    <!-- ✅ Navigation will load here -->
    <div id="user-navigation"></div>

    <h1>Module 3</h1>
    <h2>Welcome <span id="emp"></span></h2>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const name = localStorage.getItem("empName");
        document.getElementById("emp").innerText = name;
      });

      // Load Navigation
      fetch("./layout/userNavigation.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("user-navigation").innerHTML = data;
        });

      // Username load
      document.addEventListener("DOMContentLoaded", () => {
        const name = localStorage.getItem("empName");
        document.getElementById("emp").innerText = name;
      });
    </script>
  </body>
</html>
